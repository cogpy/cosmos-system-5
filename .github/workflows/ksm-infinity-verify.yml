name: KSM∞ Living Structure Verify

# Generated by /ksm-infinity at meta-level nn⁴ (Mutation M-12).
# Property enforced: 11. Roughness, 3. Boundaries, 14. Simplicity (Alexander).
#
# Runs cosmos-doctor verify on every PR/push to ensure every service in the
# 18-service [[D-T]-[P-O]-[S-M]] topology retains its Dockerfile, README, and
# at least one test file. Also runs weekly (Monday 04:00 UTC) as the macro
# scale of the time-crystal-nn cadence — the parasympathetic regenerative beat.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'   # weekly Monday 04:00 UTC — parasympathetic macro beat
  workflow_dispatch: {}

jobs:
  verify:
    name: cosmos-doctor verify (18-service topology)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install ts-node
        run: npm install -g ts-node typescript @types/node

      - name: Verify polarity structure (legacy validator)
        run: node validate-polarity-structure.js

      - name: Run cosmos-doctor verify
        run: ts-node --transpile-only tools/cosmos-doctor.ts verify

      - name: Living-structure summary
        if: always()
        run: |
          echo "::group::KSM∞ Living Structure Snapshot"
          echo "Topology: 3 triads × 6 services = 18 centers"
          echo "Required artefacts per service: Dockerfile, README.md, *.test.ts"
          ts-node --transpile-only tools/cosmos-doctor.ts scan || true
          echo "::endgroup::"
